name: Build PSG TV APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Apply PSG launcher icon resources
        run: |
          if [ -f ic_launcher.zip ]; then
            mkdir -p /tmp/psg-icon
            unzip -q ic_launcher.zip -d /tmp/psg-icon
            RES_DIR="$(find /tmp/psg-icon -type d -name res -print -quit)"
            if [ -z "$RES_DIR" ]; then
              echo "ERROR: No res folder found inside ic_launcher.zip"
              find /tmp/psg-icon -maxdepth 4 -type f
              exit 1
            fi
            cp -a "$RES_DIR"/. app/src/main/res/
            # Android cannot have two files with the same resource name and
            # type in one density folder (for example ic_launcher.png + .webp).
            find app/src/main/res -type f -name 'ic_launcher.png' -print0 | while IFS= read -r -d '' png; do
              webp="${png%.png}.webp"
              if [ -f "$webp" ]; then
                rm "$webp"
                echo "Removed duplicate resource: $webp"
              fi
            done
            find app/src/main/res -type f -name 'ic_launcher_round.png' -print0 | while IFS= read -r -d '' png; do
              webp="${png%.png}.webp"
              if [ -f "$webp" ]; then
                rm "$webp"
                echo "Removed duplicate resource: $webp"
              fi
            done
          else
            echo "ERROR: ic_launcher.zip not found at repository root"
            exit 1
          fi
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Make Gradle executable
        run: chmod +x ./gradlew
      - name: Build installable debug APK
        run: ./gradlew assembleDebug
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PSG-TV-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
