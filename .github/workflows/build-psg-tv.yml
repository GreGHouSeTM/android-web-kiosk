name: Build PSG TV APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install ImageMagick for Android TV banner generation
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Apply PSG launcher icon and Android TV banner
        run: |
          set -e
          if [ ! -f ic_launcher.zip ]; then
            echo "ERROR: ic_launcher.zip not found at repository root"
            exit 1
          fi

          mkdir -p /tmp/psg-icon
          unzip -q ic_launcher.zip -d /tmp/psg-icon
          RES_DIR="$(find /tmp/psg-icon -type d -name res -print -quit)"
          if [ -z "$RES_DIR" ]; then
            echo "ERROR: No res folder found inside ic_launcher.zip"
            find /tmp/psg-icon -maxdepth 4 -type f
            exit 1
          fi

          cp -a "$RES_DIR"/. app/src/main/res/

          # Prefer the supplied PNGs over the old WebP resources with the same name.
          while IFS= read -r -d '' png; do
            webp="${png%.png}.webp"
            if [ -f "$webp" ]; then
              rm "$webp"
              echo "Removed duplicate resource: $webp"
            fi
          done < <(find app/src/main/res -type f -name '*.png' -print0)

          # Use the standard adaptive-icon resource names generated by Android Asset Studio.
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF
          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          # Create a landscape Android TV banner from the original high-resolution logo.
          LOGO="$(find /tmp/psg-icon -type f \( -iname '*.png' -o -iname '*.webp' \) ! -path '*/res/*' -printf '%s %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          if [ -n "$LOGO" ]; then
            mkdir -p app/src/main/res/drawable-nodpi
            convert -size 320x180 xc:'#071B49' \
              \( "$LOGO" -resize 105x105 \) -gravity west -geometry +34+0 -composite \
              -fill white -font DejaVu-Sans-Bold -pointsize 30 -gravity center -annotate +43+0 'PSG TV' \
              app/src/main/res/drawable-nodpi/tv_banner.png
          else
            echo "WARNING: no standalone logo found; retaining existing TV banner"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build installable debug APK
        run: ./gradlew assembleDebug

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PSG-TV-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
